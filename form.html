<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a href="./index.html">Home</a>
    <form>
      <fieldset>
        <legend>Personal info</legend>
        <div>
          <label for="first-name">First name</label>
          <input type="text" name="first-name" id="first-name" />
        </div>
        <div>
          <label for="last-name">Last name</label>
          <input type="text" name="last-name" id="last-name" />
        </div>
        <div>
          <label for="birthday">Birthday</label>
          <input type="datetime-local" name="birthday" id="birthday" />
        </div>
        <div>
          <p>Gender</p>
          <label for="male">Male</label>
          <input type="radio" name="radio" id="male" />
          <label for="female">Female</label>
          <input type="radio" name="radio" id="female" />
        </div>
        <div>
          <label for="number">Drive experience</label>
          <input type="number" name="number" id="number" min="0" max="100" />
          <span>years</span>
        </div>
      </fieldset>
      <fieldset>
        <legend>Contacts</legend>
        <div>
          <label for="email">Email</label>
          <input type="email" name="email" id="email" />
        </div>
        <div>
          <label for="phone">Phone</label>
          <input type="tel" name="phone" id="phone" />
        </div>
        <div>
          <label for="addr">Address</label>
          <textarea name="addr" id="addr" rows="5"></textarea>
        </div>
      </fieldset>
      <fieldset>
        <legend>Car info</legend>
        <div>
          <label for="brand">Brand</label>
          <select name="brand" id="brand">
            <option value="---" selected>---</option>
            <option value="">FORD</option>
            <option value="">TOYOTS</option>
            <option value="">BMW</option>
          </select>
        </div>
        <div>
          <label for="model">Model</label>
          <select name="brand" id="model">
            <option value="---" selected>---</option>
            <option value="">Mondeo 4</option>
            <option value="">Fiesta 1.0</option>
            <option value="">RAV 4</option>
            <option value="">Camry</option>
            <option value="">X5</option>
            <option value="">i4</option>
          </select>
        </div>
        <div>
          <label for="used">Used</label>
          <input type="checkbox" name="used" id="used" />
        </div>
        <fieldset>
          <legend>Color</legend>
          <div>
            <label for="red">Red</label>
            <input type="radio" name="color" id="red" />
            <label for="black">Black</label>
            <input type="radio" name="color" id="black" />
            <label for="blue">Blue</label>
            <input type="radio" name="color" id="blue" />
            <label for="white">Wnite</label>
            <input type="radio" name="color" id="white" />
            <label for="grey">Grey</label>
            <input type="radio" name="color" id="grey" />
          </div>
        </fieldset>
        <div>
          <div>
            <label for="price">Price</label>
          </div>
          <div>
            <input type="range" name="price" min="0" max="100" step="5" value="50" list="price-list" id="price" />
            <datalist id="price-list">
              <option value="0" label="0"></option>
              <option value="10"></option>
              <option value="20" label="20"></option>
              <option value="30"></option>
              <option value="40" label="40"></option>
              <option value="50"></option>
              <option value="60" label="60"></option>
              <option value="70"></option>
              <option value="80" label="80"></option>
              <option value="90"></option>
              <option value="100" label="100"></option>
            </datalist>
          </div>
        </div>
      </fieldset>
      <div>
        <input type="reset" value="Cancel" />
        <input type="submit" value="Ok" />
      </div>
    </form>
  </body>
</html>
